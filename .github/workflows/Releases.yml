name: Build and Publish Docker Image (GHCR)

# 触发策略：
#   - 手动 workflow_dispatch：随时可跑，可自定义标签
#   - tag v*.*.*：发版时构建（这是常态发布路径）
#   - main 分支：默认只构建不推送（做一次构建验证），避免每次 push 都等待 QEMU 多架构推送
#     需要"随时推送 main 快照"时，手动跑 workflow_dispatch 并输入 :main 之类的标签
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '自定义标签 (例如: v2.1.0 或 main)。留空则不额外打标签'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write   # 推送镜像到 GHCR 必需

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Decide whether to push
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            echo "push=false" >> $GITHUB_OUTPUT
            echo "推送已跳过：main 分支 push 仅做构建验证"
          else
            echo "push=true" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        if: steps.guard.outputs.push == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from version.py
        id: version
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, '.'); from version import __version__; print(__version__)")
          echo "version_with_v=v$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/pt-accelerator
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ steps.version.outputs.version_with_v }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.guard.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
